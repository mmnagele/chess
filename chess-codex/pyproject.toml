[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-llm"
version = "0.1.0"
description = "Chess application with LLM-powered AI opponents"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
extend-ignore = ["E203", "E402", "E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
